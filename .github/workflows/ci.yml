name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  test:
    name: test (py${{ matrix.python }}, ${{ matrix.pg }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { python: "3.11", pg: "pgvector/pgvector:pg17" }
          - { python: "3.12", pg: "pgvector/pgvector:pg17" }
          - { python: "3.13", pg: "pgvector/pgvector:pg17" }
          - { python: "3.12", pg: "pgvector/pgvector:0.7.4-pg16" }
          - { python: "3.10", pg: "pgvector/pgvector:pg15" }
    services:
      postgres:
        image: ${{ matrix.pg }}
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      ANONYMIZED_TELEMETRY: "False"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: uv sync --frozen
      - run: uv run pytest -q -ra

  pooler:
    name: test behind PgBouncer (transaction mode)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-timeout 3s --health-retries 30
      pgbouncer:
        image: edoburu/pgbouncer:v1.25.2-p0
        env:
          DATABASE_URL: postgres://postgres:postgres@postgres:5432/postgres
          POOL_MODE: transaction
          AUTH_TYPE: scram-sha-256
          MAX_PREPARED_STATEMENTS: "0"
        ports: ["6432:5432"]
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      PGCHROMA_TEST_POOLER_URL: postgresql://postgres:postgres@localhost:6432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - name: wait for PgBouncer
        run: for i in $(seq 1 30); do pg_isready -h localhost -p 6432 && break; sleep 1; done
      - run: uv run pytest -q -ra tests/test_pooler.py

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: pgchroma:ci
