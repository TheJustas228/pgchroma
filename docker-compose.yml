# Postgres + pgvector and pgchroma, ready for a Chroma client on http://localhost:8000
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30

  pgchroma:
    image: ghcr.io/thejustas228/pgchroma:latest
    build: .
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/postgres
      # PGCHROMA_AUTH_TOKENS: change-me
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata: {}
