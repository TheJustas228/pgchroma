{% extends "base.html" %}

{% block extrahead %}
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="pgchroma">
  <meta property="og:title" content="{% if page and page.title and not page.is_homepage %}{{ page.title }} - {% endif %}pgchroma">
  <meta property="og:description" content="{{ (page.meta and page.meta.description) or config.site_description }}">
  <meta property="og:image" content="{{ config.site_url }}assets/social.png">
  <meta property="og:image:width" content="1280">
  <meta property="og:image:height" content="640">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="{{ config.site_url }}assets/social.png">
{% endblock %}
